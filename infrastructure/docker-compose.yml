services:
  backend:
    build:
      context: ../backend
    environment:
      SNAKE_ENV: production
      SNAKE_API_HOST: 0.0.0.0
      SNAKE_DATABASE_URL: sqlite:////data/snake.db
      SNAKE_JWT_SECRET_KEY: ${SNAKE_JWT_SECRET_KEY:?Set SNAKE_JWT_SECRET_KEY to a random secret of at least 32 characters}
      SNAKE_ALLOWED_ORIGINS: ${SNAKE_ALLOWED_ORIGINS:-http://localhost:3000}
      SNAKE_BACKEND_ED25519_PRIVATE_KEY_B64: ${SNAKE_BACKEND_ED25519_PRIVATE_KEY_B64:-}
    ports:
      - "8000:8000"
    volumes:
      - snake-data:/data
    restart: unless-stopped

  worker-validator:
    profiles: ["worker"]
    build:
      context: ../backend
      dockerfile: worker.Dockerfile
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.50
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    network_mode: none
    environment:
      SNAKE_BACKEND_ED25519_PUBLIC_KEY_B64: ${SNAKE_BACKEND_ED25519_PUBLIC_KEY_B64:-}
      SNAKE_WORKER_ED25519_PRIVATE_KEY_B64: ${SNAKE_WORKER_ED25519_PRIVATE_KEY_B64:-}
      SNAKE_WORKER_ID: ${SNAKE_WORKER_ID:-local-validator}
      SNAKE_WORKER_KEY_ID: ${SNAKE_WORKER_KEY_ID:-local-validator-v1}
    stdin_open: true
    restart: "no"

volumes:
  snake-data:
