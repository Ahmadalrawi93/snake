name: Backend tests

on:
  push:
    paths:
      - "backend/**"
      - "infrastructure/docker-compose.yml"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - "infrastructure/docker-compose.yml"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q
      - name: Verify database migrations
        env:
          SNAKE_DATABASE_URL: sqlite:///./migration-ci.db
        run: alembic upgrade head
      - name: Validate production Compose security settings
        env:
          SNAKE_JWT_SECRET_KEY: ci-only-placeholder-secret-not-for-deployment
          SNAKE_ALLOWED_ORIGINS: https://app.example.com
          SNAKE_ALLOWED_HOSTS: api.example.com
        run: |
          docker compose -f ../infrastructure/docker-compose.yml config --format json > /tmp/snake-compose.json
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("/tmp/snake-compose.json").read_text())
          backend = config["services"]["backend"]
          environment = backend["environment"]
          assert environment["SNAKE_ENVIRONMENT"] == "production"
          assert environment["SNAKE_SESSION_COOKIE_SECURE"] == "true"
          assert environment["SNAKE_ALLOWED_ORIGINS"] == "https://app.example.com"
          assert environment["SNAKE_ALLOWED_HOSTS"] == "api.example.com"
          assert environment["SNAKE_MAX_REQUEST_BODY_BYTES"] == "2097152"
          assert backend["ports"][0]["host_ip"] == "127.0.0.1"
          assert backend["ports"][0]["published"] == "8000"
          print("production Compose security settings OK")
          PY
      - name: Build validation-only worker image
        run: docker build -f worker.Dockerfile -t snake-worker-validator:test .
      - name: Smoke-test worker runtime imports
        run: >-
          docker run --rm --entrypoint python snake-worker-validator:test -c
          "import worker_https_server, worker_passive_recon;
          from app.core.worker_protocol import WorkerTaskEnvelope;
          from app.schemas.worker_transport import WorkerTaskResponse;
          print('worker runtime imports OK')"
